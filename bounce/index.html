<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bounce</title>
<meta name="description" content="빨간 공을 굴려 링을 모으고 출구로 가는 HTML5 바운스 게임">
<style>
  :root { --bg: #0f1730; --fg: #ffffff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
  #touch {
    position: fixed; left: 0; right: 0; bottom: 0; display: none;
    justify-content: space-between; padding: 16px; pointer-events: none;
  }
  .pad { display: flex; gap: 14px; }
  .btn {
    pointer-events: auto; width: 74px; height: 74px; border-radius: 50%;
    background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.4);
    color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center;
  }
  .btn.on { background: rgba(255,255,255,.45); }
  @media (pointer: coarse) { #touch { display: flex; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="pad">
    <div class="btn" data-k="l">◀</div>
    <div class="btn" data-k="r">▶</div>
  </div>
  <div class="pad">
    <div class="btn" data-k="j">⤒</div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const T = 32, ROWS = 12, VH = ROWS * T;
  const ACC = 1400, AIRACC = 950, FRIC = 1000, MAXV = 235;
  const G = 1800, JUMP = 690, SPRING = 980, MAXFALL = 900;

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, scale = 1, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(innerWidth * dpr);
    cv.height = Math.round(innerHeight * dpr);
    scale = cv.height / VH;
    W = cv.width / scale;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Levels ----------
  function mk(w, build) {
    const g = Array.from({ length: ROWS }, () => Array(w).fill(' '));
    const L = { w, h: ROWS, g, start: { x: 2, y: 8 }, exit: { x: w - 3, y: 7 } };
    const set = (x, y, c) => { if (x >= 0 && x < w && y >= 0 && y < ROWS) g[y][x] = c; };
    build({
      ground: (a, b) => { for (let x = a; x < b; x++) for (let y = 9; y < ROWS; y++) set(x, y, '#'); },
      plat: (x, y, n) => { for (let i = 0; i < n; i++) set(x + i, y, '#'); },
      block: (x, y, bw, bh) => { for (let i = 0; i < bw; i++) for (let j = 0; j < bh; j++) set(x + i, y + j, '#'); },
      spike: (x, y, n = 1) => { for (let i = 0; i < n; i++) set(x + i, y, '^'); },
      ring: (x, y) => set(x, y, 'o'),
      spring: (x, y) => set(x, y, 'S'),
      exit: (x, y) => { L.exit = { x, y }; },
      start: (x, y) => { L.start = { x, y }; },
    });
    L.total = g.flat().filter(c => c === 'o').length;
    return L;
  }

  const LEVELS = [
    () => mk(60, b => {
      b.ground(0, 14); b.ground(18, 60);
      b.plat(8, 6, 3); b.ring(9, 5);
      b.ring(16, 6);
      b.spike(26, 8, 2);
      b.plat(30, 6, 4); b.ring(31, 5); b.ring(32, 5);
      b.spike(38, 8, 3);
      b.plat(41, 7, 2); b.plat(44, 5, 3); b.ring(45, 4);
      b.ring(52, 8);
      b.exit(57, 7);
    }),
    () => mk(80, b => {
      b.ground(0, 10); b.ground(14, 22); b.ground(26, 40); b.ground(46, 80);
      b.ring(12, 6); b.ring(24, 6);
      b.plat(17, 6, 3); b.ring(18, 5);
      b.spring(30, 8); b.plat(31, 3, 4); b.ring(31, 2); b.ring(33, 2);
      b.spike(38, 8, 2);
      b.plat(42, 7, 2);
      b.spike(52, 8, 3); b.spike(60, 8, 1);
      b.plat(56, 6, 3); b.ring(57, 5);
      b.block(64, 0, 8, 7); b.ring(68, 8);
      b.exit(77, 7);
    }),
    () => mk(92, b => {
      b.ground(0, 8); b.ground(12, 16); b.ground(20, 24); b.ground(28, 92);
      b.ring(10, 6); b.ring(18, 6); b.ring(26, 6);
      b.spike(34, 8, 3); b.ring(35, 5);
      b.spring(44, 8); b.spike(45, 8, 8);
      b.plat(46, 2, 6); b.ring(47, 1); b.ring(50, 1);
      b.spike(56, 8, 7);
      b.plat(58, 6, 2); b.plat(62, 4, 2); b.ring(63, 3);
      b.block(70, 0, 10, 7); b.ring(75, 8);
      b.spike(82, 8, 1); b.spike(85, 8, 1);
      b.exit(89, 7);
    }),
  ];

  // ---------- Audio ----------
  let ac = null;
  function sfx(f, dur = 0.12, type = 'square', slide = 0, vol = 0.08) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), gn = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
      gn.gain.setValueAtTime(vol, t);
      gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(ac.destination); o.start(t); o.stop(t + dur);
    } catch (e) { /* audio unavailable */ }
  }

  // ---------- State ----------
  let state = 'title', levelIdx = 0, L = null, lives = 3, got = 0;
  let camX = 0, stateTimer = 0, runTime = 0, jumpBuf = 0, time = 0;
  const P = { x: 0, y: 0, vx: 0, vy: 0, r: 12, ground: 0, rot: 0, squash: 0 };
  const parts = [];
  const keys = { l: false, r: false, j: false };

  function loadLevel(i) {
    levelIdx = i; L = LEVELS[i](); got = 0;
    respawn();
    camX = clampCam(P.x - W / 2);
  }
  function respawn() {
    P.x = L.start.x * T + T / 2; P.y = L.start.y * T + T - P.r - 0.01;
    P.vx = P.vy = 0; P.ground = 0; P.squash = 0;
  }
  function newGame() { lives = 3; runTime = 0; loadLevel(0); state = 'play'; }

  const tile = (tx, ty) => (L && ty >= 0 && ty < L.h && tx >= 0 && tx < L.w) ? L.g[ty][tx] : ' ';
  function solid(tx, ty) {
    if (tx < 0 || tx >= L.w || ty < 0) return true;
    if (ty >= L.h) return false;
    const c = L.g[ty][tx];
    return c === '#' || c === 'S';
  }
  const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

  function burst(x, y, color, n = 14, spd = 220) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6 + Math.random() * 0.4, color });
    }
  }

  function die() {
    if (state !== 'play') return;
    state = 'dead'; stateTimer = 1.1;
    burst(P.x, P.y, '#e8392f', 26, 280);
    sfx(300, 0.4, 'sawtooth', -240, 0.09);
  }

  // ---------- Physics ----------
  function step(dt) {
    const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
    const onGround = P.ground > 0;
    if (dir) P.vx += dir * (onGround ? ACC : AIRACC) * dt;
    else {
      const f = (onGround ? FRIC : 260) * dt;
      P.vx = Math.abs(P.vx) <= f ? 0 : P.vx - Math.sign(P.vx) * f;
    }
    P.vx = Math.max(-MAXV, Math.min(MAXV, P.vx));

    P.vy += G * dt * (!keys.j && P.vy < -250 ? 2.2 : 1);
    P.vy = Math.min(P.vy, MAXFALL);
    P.ground -= dt; jumpBuf -= dt;
    if (jumpBuf > 0 && P.ground > 0) {
      P.vy = -JUMP; P.ground = 0; jumpBuf = 0;
      sfx(420, 0.12, 'square', 300, 0.06);
    }

    const r = P.r;
    // X axis
    P.x += P.vx * dt;
    {
      const y0 = Math.floor((P.y - r) / T), y1 = Math.floor((P.y + r - 0.01) / T);
      if (P.vx > 0) {
        const tx = Math.floor((P.x + r) / T);
        for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { P.x = tx * T - r - 0.01; P.vx *= -0.25; break; }
      } else if (P.vx < 0) {
        const tx = Math.floor((P.x - r) / T);
        for (let ty = y0; ty <= y1; ty++) if (solid(tx, ty)) { P.x = (tx + 1) * T + r + 0.01; P.vx *= -0.25; break; }
      }
    }
    // Y axis
    P.y += P.vy * dt;
    {
      const x0 = Math.floor((P.x - r) / T), x1 = Math.floor((P.x + r - 0.01) / T);
      if (P.vy > 0) {
        const ty = Math.floor((P.y + r) / T);
        let hit = false, spr = false;
        for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) { hit = true; if (tile(tx, ty) === 'S') spr = true; }
        if (hit) {
          P.y = ty * T - r - 0.01;
          const imp = P.vy;
          if (spr) {
            P.vy = -SPRING; P.ground = 0; P.squash = 0.45;
            sfx(220, 0.35, 'triangle', 700, 0.1);
          } else {
            P.vy = imp > 450 ? -imp * 0.32 : 0;
            P.ground = 0.1;
            if (imp > 300) { P.squash = Math.min(imp / 1000, 0.45); sfx(140, 0.06, 'triangle', -60, 0.05); }
          }
        }
      } else if (P.vy < 0) {
        const ty = Math.floor((P.y - r) / T);
        for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) { P.y = (ty + 1) * T + r + 0.01; P.vy = 0; break; }
      }
    }
    P.rot += P.vx * dt / r;

    // Tiles touching the ball
    const bx = P.x - r, by = P.y - r, bs = r * 2;
    const tx0 = Math.floor(bx / T), tx1 = Math.floor((bx + bs) / T);
    const ty0 = Math.floor(by / T), ty1 = Math.floor((by + bs) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const c = tile(tx, ty);
      if (c === '^' && overlap(bx + 2, by + 2, bs - 4, bs - 4, tx * T + 6, ty * T + 12, T - 12, T - 12)) { die(); return; }
      if (c === 'o' && overlap(bx, by, bs, bs, tx * T + 8, ty * T + 2, T - 16, T - 4)) {
        L.g[ty][tx] = ' '; got++;
        burst(tx * T + T / 2, ty * T + T / 2, '#ffd23f', 12, 160);
        sfx(880, 0.1, 'square', 440, 0.05);
        if (got === L.total) setTimeout(() => sfx(660, 0.25, 'triangle', 660, 0.07), 120);
      }
    }
    if (P.y - r > L.h * T) { die(); return; }

    const e = L.exit;
    if (got === L.total && overlap(bx, by, bs, bs, e.x * T + 6, e.y * T, T - 12, T * 2)) {
      state = levelIdx === LEVELS.length - 1 ? 'win' : 'clear';
      stateTimer = 0.5;
      burst(e.x * T + T / 2, e.y * T + T, '#7dffb0', 30, 260);
      [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => sfx(f, 0.15, 'square', 0, 0.06), i * 110));
    }
  }

  function clampCam(x) {
    const max = L.w * T - W;
    return max < 0 ? max / 2 : Math.max(0, Math.min(max, x));
  }

  function update(dt) {
    time += dt;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    P.squash *= Math.pow(0.0005, dt);
    if (stateTimer > 0) stateTimer -= dt;

    if (state === 'play') {
      runTime += dt;
      let left = dt;
      while (left > 0 && state === 'play') { const s = Math.min(left, 1 / 120); step(s); left -= s; }
    } else if (state === 'dead' && stateTimer <= 0) {
      lives--;
      if (lives <= 0) { state = 'over'; stateTimer = 0.6; }
      else { respawn(); state = 'play'; }
    }
    if (L) camX += (clampCam(P.x - W / 2) - camX) * Math.min(1, dt * 8);
  }

  // ---------- Rendering ----------
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, '#4fb6ec'); g.addColorStop(1, '#c8efff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, VH);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 8; i++) {
      const cx = ((i * 260 - camX * 0.15) % (W + 300) + W + 300) % (W + 300) - 150;
      const cy = 40 + (i * 53) % 110;
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, 7); ctx.arc(cx + 20, cy - 8, 22, 0, 7); ctx.arc(cx + 42, cy, 16, 0, 7);
      ctx.fill();
    }
    hills(0.3, '#8fd3a6', 250, 60, 0.008);
    hills(0.55, '#5fb57d', 290, 45, 0.013);
  }
  function hills(par, color, base, amp, freq) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, VH);
    for (let x = 0; x <= W + 8; x += 8) {
      const wx = x + camX * par;
      ctx.lineTo(x, base - Math.sin(wx * freq) * amp - Math.sin(wx * freq * 2.7) * amp * 0.3);
    }
    ctx.lineTo(W, VH); ctx.closePath(); ctx.fill();
  }

  function drawBrick(x, y, tx, ty) {
    ctx.fillStyle = '#b8432f'; ctx.fillRect(x, y, T, T);
    ctx.fillStyle = '#7d2a1c';
    ctx.fillRect(x, y + 15, T, 2); ctx.fillRect(x, y + 31, T, 1);
    const off = (ty % 2) * 16;
    ctx.fillRect(x + (off + 8) % 32, y, 2, 15);
    ctx.fillRect(x + (off + 24) % 32, y + 17, 2, 14);
    if (!solid(tx, ty - 1)) { ctx.fillStyle = '#e06a4f'; ctx.fillRect(x, y, T, 3); }
  }
  function drawSpike(x, y) {
    ctx.fillStyle = '#c9d1da'; ctx.strokeStyle = '#4a5560'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 2; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * 16 + 1, y + T); ctx.lineTo(x + i * 16 + 8, y + 10); ctx.lineTo(x + i * 16 + 15, y + T);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  function drawRing(x, y) {
    const cx = x + T / 2, cy = y + T / 2 + Math.sin(time * 3 + x * 0.05) * 2;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#b8860b'; ctx.beginPath(); ctx.ellipse(cx + 1, cy + 1, 7, 13, 0, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.ellipse(cx, cy, 7, 13, 0, 0, 7); ctx.stroke();
  }
  function drawSpring(x, y) {
    ctx.fillStyle = '#3b3f4a'; ctx.fillRect(x + 2, y + 22, T - 4, 10);
    ctx.strokeStyle = '#d6dbe3'; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(x + 8, y + 22);
    for (let i = 0; i < 4; i++) ctx.lineTo(x + (i % 2 ? 8 : 24), y + 20 - i * 3.5);
    ctx.stroke();
    ctx.fillStyle = '#ffcc00'; ctx.fillRect(x + 2, y + 2, T - 4, 6);
    ctx.fillStyle = '#e09c00'; ctx.fillRect(x + 2, y + 6, T - 4, 2);
  }
  function drawExit() {
    const e = L.exit, x = e.x * T, y = e.y * T, open = got === L.total;
    ctx.fillStyle = '#4a3b2a'; ctx.fillRect(x + 2, y - 4, T - 4, T * 2 + 4);
    if (open) {
      const pulse = 0.6 + Math.sin(time * 6) * 0.25;
      const g = ctx.createLinearGradient(0, y, 0, y + T * 2);
      g.addColorStop(0, `rgba(125,255,176,${pulse})`); g.addColorStop(1, 'rgba(40,200,120,.9)');
      ctx.fillStyle = g; ctx.fillRect(x + 6, y, T - 12, T * 2);
    } else {
      ctx.fillStyle = '#20252e'; ctx.fillRect(x + 6, y, T - 12, T * 2);
      ctx.fillStyle = '#8e99a6';
      for (let i = 0; i < 3; i++) ctx.fillRect(x + 8 + i * 6, y, 2, T * 2);
    }
  }
  function drawBall() {
    const s = P.squash;
    ctx.save();
    ctx.translate(P.x, P.y + P.r);
    ctx.scale(1 + s, 1 - s);
    ctx.translate(0, -P.r);
    const g = ctx.createRadialGradient(-4, -5, 2, 0, 0, P.r);
    g.addColorStop(0, '#ff8a7a'); g.addColorStop(0.5, '#e8392f'); g.addColorStop(1, '#9c1d16');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, P.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(80,10,5,.55)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, P.r - 4, P.rot, P.rot + 1.2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(-4, -5, 3.5, 2.2, -0.6, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawWorld() {
    ctx.save();
    ctx.translate(-Math.round(camX * scale) / scale, 0);
    const a = Math.max(0, Math.floor(camX / T) - 1), b = Math.min(L.w - 1, Math.ceil((camX + W) / T) + 1);
    drawExit();
    for (let ty = 0; ty < L.h; ty++) for (let tx = a; tx <= b; tx++) {
      const c = L.g[ty][tx], x = tx * T, y = ty * T;
      if (c === '#') drawBrick(x, y, tx, ty);
      else if (c === '^') drawSpike(x, y);
      else if (c === 'o') drawRing(x, y);
      else if (c === 'S') drawSpring(x, y);
    }
    if (state !== 'dead') drawBall();
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  function text(str, x, y, size, color = '#fff', align = 'center') {
    ctx.font = `700 ${size}px system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(str, x + 2, y + 2);
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function fmtTime(t) {
    const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
    return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  }

  function drawHUD() {
    text(`LEVEL ${levelIdx + 1}`, 16, 20, 16, '#fff', 'left');
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(112, 20, 4.5, 8, 0, 0, 7); ctx.stroke();
    text(`${got}/${L.total}`, 124, 20, 16, got === L.total ? '#7dffb0' : '#fff', 'left');
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < lives ? '#e8392f' : 'rgba(255,255,255,.3)';
      ctx.beginPath(); ctx.arc(W - 22 - i * 24, 20, 8, 0, 7); ctx.fill();
    }
    text(fmtTime(runTime), W / 2, 20, 14, 'rgba(255,255,255,.9)');
  }

  function panel(title, lines, color = '#fff') {
    ctx.fillStyle = 'rgba(10,15,35,.55)'; ctx.fillRect(0, 0, W, VH);
    text(title, W / 2, VH / 2 - 50, Math.min(52, W / 8), color);
    lines.forEach((l, i) => text(l, W / 2, VH / 2 + 10 + i * 28, Math.min(17, W / 24), 'rgba(255,255,255,.92)'));
  }

  const isTouch = matchMedia('(pointer: coarse)').matches;
  const go = isTouch ? '화면을 탭하세요' : 'Space / Enter 를 누르세요';

  function render() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawBackground();
    if (!L) loadLevel(0);
    drawWorld();
    if (state !== 'title') drawHUD();
    if (state === 'title') {
      panel('BOUNCE', ['링을 모두 모으면 출구가 열려요', '←→ 이동 · Space/↑ 점프 · P 일시정지', go], '#ff6b5e');
    } else if (state === 'pause') panel('PAUSED', [isTouch ? '탭해서 계속' : 'P 를 눌러 계속']);
    else if (state === 'clear') panel(`LEVEL ${levelIdx + 1} CLEAR!`, [go + ' → 다음 레벨'], '#7dffb0');
    else if (state === 'over') panel('GAME OVER', [`LEVEL ${levelIdx + 1} 에서 끝`, go + ' → 다시 시작'], '#ff6b5e');
    else if (state === 'win') panel('YOU WIN!', [`클리어 시간 ${fmtTime(runTime)}`, go + ' → 처음부터'], '#ffd23f');
  }

  // ---------- Input ----------
  function advance() {
    if (stateTimer > 0) return;
    if (state === 'title' || state === 'over' || state === 'win') newGame();
    else if (state === 'clear') { loadLevel(levelIdx + 1); state = 'play'; }
    else if (state === 'pause') state = 'play';
  }
  function pressJump() { keys.j = true; jumpBuf = 0.12; }
  const KEYMAP = {
    ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
    ArrowUp: 'j', KeyW: 'j', Space: 'j',
  };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (k || e.code === 'Enter') e.preventDefault();
    if (e.repeat) return;
    if (state !== 'play' && state !== 'dead') {
      if (e.code === 'Space' || e.code === 'Enter' || (state === 'pause' && e.code === 'KeyP')) advance();
      return;
    }
    if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; return; }
    if (k === 'j') pressJump(); else if (k) keys[k] = true;
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { keys.l = keys.r = keys.j = false; if (state === 'play') state = 'pause'; });

  cv.addEventListener('pointerdown', () => { if (state !== 'play' && state !== 'dead') advance(); });
  document.querySelectorAll('.btn').forEach(btn => {
    const k = btn.dataset.k;
    const down = e => {
      e.preventDefault();
      if (state !== 'play' && state !== 'dead') { advance(); return; }
      btn.classList.add('on');
      if (k === 'j') pressJump(); else keys[k] = true;
    };
    const up = () => { btn.classList.remove('on'); keys[k] = false; };
    btn.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => btn.addEventListener(ev, up));
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
